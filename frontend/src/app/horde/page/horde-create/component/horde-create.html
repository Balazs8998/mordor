<div class="page-layout">

  <aside class="right-aside">
    <!-- későbbi tartalom -->
  </aside>

  <main class="page-main">



    <section class="horde-create-section">
      <div class="section-content">
        <div>
          <h1>
            FORGE YOUR HORDE
          </h1>
          <p>
            A warlord without a horde is no warlord at all.
            And the useless do not survive long upon the scorched lands of Mordor.
          </p>
        </div>

        <form [formGroup]="hordeForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="horde-name">Horde Name</label>
          <input
            id="horde-name"
            type="text"
            placeholder="Enter your Horde's name"
            name="horde-name"
            formControlName="name"
          />
        </div>

        <button type="submit" class="submit">Create Horde</button>
    </form>
      </div>
      </section>

  </main>


  <aside class="left-aside">

    <div class="player">

      <div class="player-image-wrapper">
        <img
          class="player-image"
          src="/img/horde/player/lvl_one.png"
          alt="Player rank"
        >
      </div>

      <div class="player-info">
        <span class="player-rank">Warlord</span>
        <span class="player-level">Level 1</span>
      </div>

    </div>

  </aside>
</div>
