server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration



logging:
  level:
    org.hibernate.SQL: DEBUG
    com.mordor: DEBUG